[project]
name = "documentos-service"
version = "0.1.0"
description = "Microservicio de gestión de documentos (parte de la migración del monolito El-Destripador-de-PDFs)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.24.0,<1.0.0",
    "mongomock>=4.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["App*"]
