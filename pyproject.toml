[project]
name = "documentos-service"
version = "0.1.0"
description = "Microservicio de gestión de documentos (parte de la migración del monolito El-Destripador-de-PDFs)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pymongo>=4.18.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.24.0,<1.0.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "httpx>=0.24.0,<1.0.0",
    "mongomock>=4.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["App*"]

[tool.ruff]
line-length = 120
src = ["App", "test"]

[tool.ruff.lint]
# E/W estilo, F errores, I orden de imports, B bugs comunes, UP sintaxis moderna, SIM simplificaciones
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# B008: Depends()/File()/Form() en los parámetros es el patrón oficial de FastAPI.
ignore = ["B008"]

