[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro-docu"
version = "0.1.0"
description = "Microservicio HTTP inicial con FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
]

[tool.uvicorn]
app = "main:app"
host = "127.0.0.1"
port = 8000